<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#19191d" />
    <title>ClawMind</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <script>
      // 首帧前定主题（与 stores/chat.ts 的 localStorage 键一致），避免深浅色闪烁
      try {
        var raw = localStorage.getItem("clawmind_ui");
        var dark = raw ? JSON.parse(raw).dark !== false : true;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">
        ClawMind 需要 JavaScript。后端 API 可以脱离页面使用。
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
