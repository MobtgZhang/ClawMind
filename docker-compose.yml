services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # 构建期依赖源：默认走国内镜像，proxy.golang.org 不可达时可覆盖。
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.google.cn}
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SYSTEM_PROMPT: ${SYSTEM_PROMPT:-你是一个有帮助的助手。}
      LISTEN: ":8080"
      DB_PATH: /data/clawmind.db
      TOOLS_PATH: /app/config/tools.json
      # 设置页写入的模型/密钥/参数落在 .clawmind/config.json，与数据库同卷，容器重建不丢。
      CLAWMIND_DIR: /data/.clawmind
    volumes:
      - clawmind-data:/data
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  clawmind-data:
